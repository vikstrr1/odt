name: Application Build & Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'infra/**'
      - '**.md'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WIF_POOL_ID }}/providers/${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          IMAGE=europe-west1-docker.pkg.dev/${PROJECT}/odt-repo/odt:${{ github.sha }}
          docker build -t $IMAGE -f Dockerfile .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Get Cloud SQL Connection Name
        run: |
          # Dynamically fetch the connection string for the database in this project
          CLOUDSQL_CONN=$(gcloud sql instances list --format="value(connectionName)" --limit=1)
          echo "CLOUDSQL_CONN=$CLOUDSQL_CONN" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy odt-2026 \
            --image="$IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --add-cloudsql-instances="$CLOUDSQL_CONN" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest \
            --service-account="${{ secrets.GCP_SA_EMAIL }}" \
            --no-allow-unauthenticated
