name: Deploy to GCP (Terraform + Build + Cloud Run)
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP with Workload Identity
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WIF_POOL_ID }}/providers/${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          install_components: cloud_sql_proxy

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -auto-approve -var="project=${{ secrets.GCP_PROJECT }}" -var="project_number=${{ secrets.GCP_PROJECT_NUMBER }}" -var="region=${{ secrets.GCP_REGION }}" -var="wif_pool_id=${{ secrets.GCP_WIF_POOL_ID }}" -var="wif_provider_id=${{ secrets.GCP_WIF_PROVIDER_ID }}"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          IMAGE=europe-west1-docker.pkg.dev/${PROJECT}/odt-repo/odt:${{ github.sha }}
          docker build -t $IMAGE -f Dockerfile .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        env:
          CLOUDSQL_CONN: $(terraform -chdir=infra output -raw cloudsql_instance_connection_name)
        run: |
          gcloud run deploy odt-2026 \
            --image="$IMAGE" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --add-cloudsql-instances="$CLOUDSQL_CONN" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,ADMIN_EMAILS=ADMIN_EMAILS:latest \
            --service-account="${{ secrets.GCP_SA_EMAIL }}" \
            --no-allow-unauthenticated
