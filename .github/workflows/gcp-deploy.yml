name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker --quiet

      - name: Build container image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME || 'odt-tracker' }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./odt_tracker_app
          docker push "$IMAGE"
        env:
          IMAGE_NAME: odt-tracker

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.CLOUD_RUN_SERVICE || 'odt-tracker' }}
          image: gcr.io/${{ secrets.GCP_PROJECT }}/odt-tracker:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          allow-unauthenticated: false
        env:
          CLOUD_RUN_SERVICE: odt-tracker

      - name: Post-deploy info
        run: |
          echo "Deployed to Cloud Run service: ${CLOUD_RUN_SERVICE}"
