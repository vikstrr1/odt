name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker --quiet

      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into backend static
        run: |
          rm -rf odt_tracker_app/static/frontend || true
          mkdir -p odt_tracker_app/static/frontend
          cp -r frontend/dist/* odt_tracker_app/static/frontend/

      - name: Build container image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME || 'odt-tracker' }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          IMAGE_NAME: odt-tracker

      - name: Deploy to Cloud Run
        run: |
          SERVICE=${{ env.CLOUD_RUN_SERVICE || 'odt-tracker' }}
          IMAGE=gcr.io/${{ secrets.GCP_PROJECT }}/odt-tracker:${{ github.sha }}
          CMD=(gcloud run deploy "$SERVICE" --image "$IMAGE" --region "${{ secrets.GCP_REGION }}" --platform managed --no-allow-unauthenticated)
          # If Cloud SQL instance is provided, add it to the deploy command
          if [ -n "${{ secrets.CLOUD_SQL_INSTANCE }}" ]; then
            CMD+=(--add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}")
          fi
          # Set runtime environment variables if provided via secrets
          ENVFLAGS=()
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            ENVFLAGS+=(--set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}")
          fi
          if [ -n "${{ secrets.ADMIN_USER }}" ]; then
            ENVFLAGS+=(--set-env-vars "ADMIN_USER=${{ secrets.ADMIN_USER }}")
          fi
          if [ -n "${{ secrets.ADMIN_PASSWORD }}" ]; then
            ENVFLAGS+=(--set-env-vars "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}")
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            ENVFLAGS+=(--set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}")
          fi
          if [ ${#ENVFLAGS[@]} -gt 0 ]; then
            CMD+=("${ENVFLAGS[@]}")
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
        env:
          CLOUD_RUN_SERVICE: odt-tracker

      - name: Post-deploy info
        run: |
          echo "Deployed to Cloud Run service: ${CLOUD_RUN_SERVICE}"
