name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Enable required GCP APIs
        run: |
          gcloud services enable cloudbuild.googleapis.com artifactregistry.googleapis.com iam.googleapis.com containeranalysis.googleapis.com run.googleapis.com iap.googleapis.com --project ${{ secrets.GCP_PROJECT }}


      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Terraform init & apply (Cloud SQL)
        working-directory: infra/cloudsql
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_project: ${{ secrets.GCP_PROJECT }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_IN_AUTOMATION: true
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud-key.json
          terraform init
          terraform apply -auto-approve -var="project=${{ secrets.GCP_PROJECT }}" -var="region=${{ secrets.GCP_REGION }}"
          INSTANCE_CONN=$(terraform output -raw instance_connection_name)
          echo "CLOUD_SQL_INSTANCE=$INSTANCE_CONN" >> $GITHUB_ENV

      - name: Create Cloud Run service account and grant Cloud SQL Client
        run: |
          PROJECT=${{ secrets.GCP_PROJECT }}
          SA_NAME=odt-run-sa
          SA_EMAIL="$SA_NAME@${PROJECT}.iam.gserviceaccount.com"
          # create service account if not exists
          if ! gcloud iam service-accounts describe "$SA_EMAIL" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud iam service-accounts create "$SA_NAME" --display-name "odt run service account" --project "$PROJECT"
          fi
          # grant Cloud SQL Client role so the service account can connect
          gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$SA_EMAIL" --role="roles/cloudsql.client" || true
          echo "CLOUD_RUN_SA=$SA_EMAIL" >> $GITHUB_ENV

      - name: Build container image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME || 'odt-tracker' }}:${{ github.sha }}"
          docker build -f odt_tracker_app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          IMAGE_NAME: odt-tracker

      - name: Deploy to Cloud Run
        run: |
          # Deploy service with runtime settings
          SERVICE=${{ env.CLOUD_RUN_SERVICE || 'odt-2026' }}
          IMAGE=gcr.io/${{ secrets.GCP_PROJECT }}/odt-tracker:${{ github.sha }}
          SA_EMAIL=${CLOUD_RUN_SA}
          CMD=(gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION || 'europe-west1' }}" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account "$SA_EMAIL" \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300s \
            --concurrency 80 \
            --min-instances 0)
          # If Cloud SQL instance is provided (from Terraform), add it to the deploy command
          if [ -n "$CLOUD_SQL_INSTANCE" ]; then
            CMD+=(--add-cloudsql-instances "$CLOUD_SQL_INSTANCE")
          fi
          # Set runtime environment variables if provided via secrets
          ENVFLAGS=()
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            ENVFLAGS+=(--set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}")
          fi
          if [ -n "${{ secrets.ADMIN_EMAIL }}" ]; then
            ENVFLAGS+=(--set-env-vars "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}")
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            ENVFLAGS+=(--set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}")
          fi
          if [ ${#ENVFLAGS[@]} -gt 0 ]; then
            CMD+=("${ENVFLAGS[@]}")
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
        env:
          CLOUD_RUN_SERVICE: odt-2026

      - name: Restrict Cloud Run access to ADMIN_EMAIL (IAM invoker)
        if: success()
        run: |
          SERVICE=${{ env.CLOUD_RUN_SERVICE || 'odt-2026' }}
          MEMBER="user:${{ secrets.ADMIN_EMAIL }}"
          # grant the specific user the Cloud Run Invoker role
          gcloud run services add-iam-policy-binding "$SERVICE" --member="$MEMBER" --role="roles/run.invoker" --region "${{ secrets.GCP_REGION || 'europe-west1' }}" --platform managed
          # remove unauthenticated access if present
          if gcloud run services remove-iam-policy-binding "$SERVICE" --member="allUsers" --role="roles/run.invoker" --region "${{ secrets.GCP_REGION || 'europe-west1' }}" --platform managed 2>/dev/null; then
            echo "Removed public unauthenticated binding"
          fi

      - name: Post-deploy info
        run: |
          echo "Deployed to Cloud Run service: ${CLOUD_RUN_SERVICE}"
